<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#11151c">
  <title>reaper-monitor · 我的监听</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="mix">
  <header class="top-sticky">
    <div class="mix-head">
      <a class="back" href="/">‹ 换人</a>
      <div class="mix-id">
        <h1 id="musician-name" class="app-title">—</h1>
        <p id="stream-status" class="muted status">连接中…</p>
      </div>
      <button id="master-mute" class="mute-btn big" aria-pressed="false" title="总静音">🔇</button>
    </div>
  </header>

  <main class="main">
    <div id="error-banner" class="banner banner-err hidden" role="alert"></div>

    <section class="card master-card" aria-labelledby="master-title">
      <div class="section-head">
        <h2 id="master-title">总音量</h2>
        <span id="master-value" class="muted value">75%</span>
      </div>
      <input id="master-level" type="range" min="0" max="1" step="0.01" value="0.75"
             aria-label="总音量" autocomplete="off">
    </section>

    <section class="card" aria-labelledby="sources-title">
      <div class="section-head">
        <h2 id="sources-title">分轨</h2>
        <span class="muted">响度 / 静音只影响你的监听</span>
      </div>
      <ul id="source-list" class="source-list"></ul>
    </section>
  </main>

  <script src="app.js?v=4"></script>
</body>
</html>
