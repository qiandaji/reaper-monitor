<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#11151c">
  <title>reaper-monitor · 选择乐手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="pick">
  <header class="top-sticky">
    <h1 class="app-title">排练监听</h1>
    <p class="muted sub">选择你的监听通道</p>
  </header>

  <main class="main">
    <div id="error-banner" class="banner banner-err hidden" role="alert"></div>

    <section class="card" aria-labelledby="pick-title">
      <div class="section-head">
        <h2 id="pick-title">我是谁？</h2>
        <span id="pick-count" class="muted"></span>
      </div>
      <div id="musician-list" class="pick-list"></div>
    </section>

    <p class="muted foot">
      同一局域网内用手机打开 <span id="lan-hint">本页地址</span>，选择你的名字后即可监听。
    </p>
  </main>

  <script src="app.js?v=4"></script>
</body>
</html>
